<!DOCTYPE html>
<html lang="en">
<head>
	<meta name="viewport" charset="UTF-8" content="width=device-width, initial-scale=1.0"/>
	<title>VI. Coin Flip</title>
</head>
<body>
	<p id="box"></p>

	<script>
		let randomNum = Math.random();
		const box = document.getElementById('box');
		// box.innerHTML = `${randomNum}:<br> `;
		let result = '';

		if (randomNum < 0.5) {
			result = "Heads";
		} else {
			result = "Tails";
		}
		box.innerHTML = result;
		console.log(result);
	</script>
</body>
</html>
