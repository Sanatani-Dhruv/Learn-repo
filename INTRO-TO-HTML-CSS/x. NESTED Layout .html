<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta e10-1 Name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nested Layouts</title>
    <style>
        .e10-box-box {
            margin-bottom: 5em;
            border: none;
            border-radius: 2px;
            font-family: Arial;
        }

        .e10-box {
            border: none;
            display: inline-block;
            border-radius: 3px;
            box-shadow: 0px 0px 7px rgba(0, 0, 0, 0.674);
            width: 150px;
            font-family: Arial;
            margin-right: 10px;
            margin-bottom: 10px;
            transition: all 0.15s;
        }

        .e10-box:hover {
            scale: 1.03;
        }

        .e10-img {
            width: 100%;
            height: 100%;
            border-radius:3px 3px 0px 0px;
            object-fit: cover;
        }

        .e10-1 {
            font-weight: bold;
            padding: 10px 0px 0px 5px;
        }

        .e10-2 {
            display: inline-block;
            padding: 5px 0px 10px 5px;
            color: rgb(106, 106, 106);
            font-size: small;
        }

        .e10-2-1 {
            display: inline-block;
            vertical-align: middle;
            width: 23px;
            height: 23px;
            border-radius: 10em;
        }

        .e10-2-2 {
            display: inline-block;
            vertical-align: middle;
            margin-left: 2px;
        }

        .e10-btn {
            margin: 0px 0px 8px 5px;
            padding: 6px 16px 6px 16px;
            background-color: rgb(0, 101, 202);
            border: none;
            color: white;
            border-radius: 5px;
            font-family: Arial;
        }
    </style>
</head>

<body>
    <div class="e10 e10-box-box">
        <div class="e10-box">
            <img src="profile-1.jpg" alt="Profile-Picture" class="e10 e10-img">
            <div class="e10 e10-1 Name">Oliver</div>
            <div class="e10 e10-2 same-frnd-box">
                <img src="profile-4.jpg" class="e10-2-1" alt="DP">
                <div class="e10 e10-2-2 same-frnd">2 mutual friends</div>
            </div>
            <button class="e10 e10-btn">Add Friend</button>
        </div>
        <div class="e10-box">
            <img src="profile-2.jpg" alt="Profile-Picture" class="e10 e10-img">
            <div class="e10 e10-1 Name">Mimi</div>
            <div class="e10 e10-2 same-frnd-box">
                <img src="profile-4.jpg" class="e10-2-1" alt="DP">
                <div class="e10 e10-2-2 same-frnd">3 mutual friends</div>
            </div>
            <button class="e10 e10-btn">Add Friend</button>
        </div>
        <div class="e10-box">
            <img src="profile-3.jpg" alt="Profile-Picture" class="e10 e10-img">
            <div class="e10 e10-1 Name">Rex</div>
            <div class="e10 e10-2 same-frnd-box">
                <img src="profile-4.jpg" class="e10-2-1" alt="DP">
                <div class="e10 e10-2-2 same-frnd">4 mutual friends</div>
            </div>
            <button class="e10 e10-btn">Add Friend</button>
        </div>
    </div>
</body>

</html>
