<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Position Fixed</title>
    <style>
        body {
            height: 2000px;
            font-family: Arial;
            background-color: whitesmoke;
        }

        .e14 {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 48px;
            background-color: white;
            border-bottom: 1px solid rgb(212, 212, 212);
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            padding: 7px 60px;
        }

        .e14-1 {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .e14-dp {
            width: 44px;
            height: 44px;
            border-radius: 100em;
        }

        .e14-name {
            font-weight: bold;
        }

        .e14-2 {
            display: flex;
            flex-direction: row;
            gap: 5px;
        }

        .e14-btn {
            padding: 6px 12px;
            border: none;
            border-radius: 5px;
            font-family: Arial;
            font-weight: bold;
        }

        .e14-btn-1 {
            background-color: rgb(0, 85, 255);
            color: white;
        }

        .e14-btn-1:hover {
            background-color: rgb(0, 62, 186);
        }
    </style>
</head>

<body>
    <div class="e14">
        <div class="e14-1">
            <img class="e14-1-1 e14-dp" src="profile-1.jpg" alt="">
            <div class="e14-1-2 e14-name">Oliver Cat</div>
        </div>
        <div class="e14-2">
            <button class="e14-2-1 e14-btn e14-btn-1">Add Friend</button>
            <button class="e14-2-2 e14-btn e14-btn-2">Message</button>
        </div>
    </div>
</body>

</html>
