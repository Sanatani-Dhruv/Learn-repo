<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Position Fixed</title>
    <style>
        body {
            height: 2000px;
            font-family: Arial;
        }

        .c14 {
            position: fixed;
            top: 0;
            bottom: 0;
            right: 0;
            left: 0;
            background-color: black;
        }
    </style>
</head>

<body>
    <div class="c14"></div>
</body>

</html>
