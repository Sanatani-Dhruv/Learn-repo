<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Position Fixed</title>
    <style>
        body {
            height: 2000px;
            font-family: Arial;
        }

        .b14 {
            background-color: rgb(0, 114, 0);
            color: white;
            position: fixed;
            top: 0;
            bottom: 0;
            right: 0;
            width: 100px;
        }

        .d14 {
            position: fixed;
            top: 0;
            bottom: 0;
            right: 0;
            left: 0;
            background-color: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .d14-modal {
            background-color: whitesmoke;
            width: 300px;
            border-radius: 5px;
            padding: 16px;
        }

        .d14-title {
            font-weight: bold;
            font-size: 1.5em;
            margin-bottom: 10px;
        }

        .d14-btn {
            font-family: Arial;
            margin-top: 10px;
        }
    </style>
</head>

<body>
    <div class="b14">
        right sidebar
    </div>

    <div class="d14">
        <div class="d14-1 d14-modal">
            <div class="d14-1-1 d14-title">Modal Title</div>
            <div class="d14-1-2 d14-message">This is a modal</div>
            <button class="d14-1-2 d14-btn">Close</button>
        </div>
    </div>
</body>

</html>
