<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Position Absolute & Relative</title>
    <style>
        body {
            height: 3000px;
        }

        .c15 {
            position: fixed;
            bottom: 10px;
            right: 10px;
            width: 320px;
            height: 180px;
            background-color: rgba(0, 0, 0, 0.6);
        }

        .c15-1 {
            position: absolute;
            top: -19px;
            left: -19px;
            border-radius: 10000em;
            background-color: black;
        }

        .c15-btn {
            color: white;
            background-color: transparent;
            border: none;
            width: 37px;
            height: 37px;
            font-size: large;
            font-weight: 400;
            font-family: Arial;
        }


        .d15 {
            position: fixed;
            bottom: 10px;
            right: 10px;
            width: 320px;
            height: 180px;
            background-color: rgba(0, 0, 0, 0.6);
        }


        .d15-1 {
            position: absolute;
            top: -19px;
            left: -19px;
            border-radius: 10000em;
            background-color: black;
        }

        .d15-btn {
            color: white;
            background-color: transparent;
            border: none;
            width: 37px;
            height: 37px;
            font-size: large;
            font-weight: 400;
            font-family: Arial;
        }
    </style>
</head>

<body>
    <div class="c15">
        <div class="c15-1">
            <button class="c15-btn">X</button>
        </div>
    </div>
</body>

</html>
