<!DOCTYPE html>
<html lang="en">
<head>
	<meta name="viewport" charset="UTF-8" content="width=device-width, initial-scale=1.0"/>
	<link rel="stylesheet" href="css/style.css">
	<link rel="icon" href="images/todo-list.svg">
	<title>Todo List</title>
</head>
<body>
	<main>
		<h1 class="title">
			<img src="images/todo-list.svg" width="26px" alt=""> Todo List
		</h1>
		<section class="input-container">
			<textarea id="task_input" cols="150" rows="2" class="task-input" name="task_input" type="text" rows="10" cols="30"></textarea>
			<br>
			<button id="task_btn">Go</button>
			<button id="reset_btn">Reset</button>
			<p id="ans_box" class="ans-box"></p>
		</section>
	</main>
	<script src="js/base.js"></script>
</body>
</html>
